<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>클로벳 - 로그인</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <div id="wrap">
    <header id="header"></header>

    <section id="login">
      <article class="box-1">
        <div class="title">
          <h3 class="main">로그인</h3>
        </div>
        <div class="content">
          <form>
            <div class="member_login">
              <label for="login_id">
                <input type="text" placeholder="아이디" id="login_id">
              </label>
              <label for="login_pw">
                <input type="text" placeholder="비밀번호" id="login_pw">
              </label>
              <label for="check" class="label_check">
                <input type="checkbox" id="check" checked>
                보안접속
              </label>
              <button>로그인</button>
            </div>
            <div class="other_login">
              <button style="background: #fae100; color: #333;">카카오 로그인</button>
              <button style="background: #2db400;">네이버 로그인</button>
            </div>
            <div class="find_acc tac">
              <a>아이디 찾기</a>
              <a>비밀번호 찾기</a>
            </div>
          </form>
          <div class="signup">
            <h4 class="tac">아직 회원이 아니신가요?</h4>
            <p class="tac">
              지금 회원가입을 하시면<br>
              다양하고 특별한 혜택이 준비되어 있습니다.
            </p>
            <a class="signup_btn">회원가입</a>
          </div>
        </div>
      </article>

      <article class="box-2">
        <div class="title">
          <h3 class="main">비회원 주문조회</h3>
          <h4 class="sub">비회원의 경우, 주문시의 주문번호로 주문조회가 가능합니다.</h4>
        </div>
        <div class="content">
          <form>
            <label for="tracking_name">
              <input type="text" placeholder="주문자명" id="tracking_name">
            </label>
            <label for="tracking_number">
              <input type="text" placeholder="주문번호(하이픈(-)포함)" id="tracking_number">
            </label>
            <label for="비회원주문 비밀번호">
              <input type="text" placeholder="비회원주문 비밀번호" id="tracking_pw">
            </label>
            <button>확인</button>
          </form>
        </div>
      </article>
    </section>

    <footer id="footer"></footer>
  </div>
  <script src="js/innerhtml.js"></script>
</body>
</html>
