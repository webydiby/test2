<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>클로벳 - 헤드웨어(Headwear)</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <div id="wrap">
    <header id="header"></header>

    <section id="headwear">
      <article class="product_header">
        <h3 class="main">헤드웨어(Headwear) <span class="product_count">(1)</span></h3>
        <div class="align_product">
          <label for="align_newest">
            <input type="radio" name="align_product" id="align_newest" checked>
            <span>신상품순</span>
          </label>
          <label for="align_name">
            <input type="radio" name="align_product" id="align_name">
            <span>상품명순</span>
          </label>
          <label for="align_low_price">
            <input type="radio" name="align_product" id="align_low_price">
            <span>낮은가격순</span>
          </label>
          <label for="align_high_price">
            <input type="radio" name="align_product" id="align_high_price">
            <span>높은가격순</span>
          </label>
          <label for="align_manufacturer">
            <input type="radio" name="align_product" id="align_manufacturer">
            <span>제조사순</span>
          </label>
          <label for="align_review">
            <input type="radio" name="align_product" id="align_review">
            <span>사용후기순</span>
          </label>
        </div>
      </article>

      <article class="pt-0">
        <div class="product_list">
          <a href="detail.html">
            <img src="img/product/product_headwear01.png" alt="클로벳 트레이닝 마스크 GEN4 제품 이미지">
            <div class="txt">
              <p class="name">클로벳 트레이닝 마스크 GEN4</p>
              <p class="info">3만장 이상판매고를 자랑하는 클로벳의 베스트셀러</p>
              <p class="price">19,700원</p>
            </div>
          </a>
        </div>
      </article>
    </section>

    <footer id="footer"></footer>
  </div>
  <script src="js/innerhtml.js"></script>
</body>
</html>
