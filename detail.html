<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>클로벳 택티컬 스마일리 기모후드 [포레스트 프로그]</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <div id="wrap">
    <header id="header"></header>

    <section id="detail">
      <article class="detail_header">
        <div class="gallery">
          <img src="img/detail/detail01.png" alt="제품 썸네일" class="thumb">
          <div class="gallery_btns">
            <img src="img/detail/detail01.png" alt="첫 번째 제품 사진 보기">
            <img src="img/detail/detail02.png" alt="두 번째 제품 사진 보기">
            <img src="img/detail/detail03.png" alt="세 번째 제품 사진 보기">
          </div>
        </div>
        <div class="content">
          <div class="name">
            <h4>클로벳 택티컬 스마일리 기모후드 [포레스트 프로그]</h4>
            <p class="c-gray">
              어려움에도 굴하지 않는 클로벳 택티컬스마일리 포레스트 프로그 버젼
            </p>
          </div>
          <h4 class="price">79,000원</h4>
          <div class="shipping">
            <p class="head">
              국내·해외배송<br>
              배송방법<br>
              배송비
            </p>
            <p class="data c-gray">
              국내배송<br>
              택배<br>
              3,000원 (150,000원 이상 구매 시 무료)
            </p>
          </div>
          <div class="size">
            <label for="select_size">옵션 선택 (필수)</label>
            <select name="" id="select_size">
              <option disabled selected>멀티프로그 스마일리</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="2XL">2XL</option>
              <option value="3XL">3XL</option>
            </select>
          </div>
          <div class="total">
            <div class="head">
              <p class="fw-500">TOTAL (QUANTITY)</p>
              <p class="fz-12px">최소주문수량 1개 이상</p>
            </div>
            <h4 class="data">
              <span class="total_price">0</span>원
              <span class="c-gray">
                (<span class="total_amount">0</span>개)
              </span>
            </h4>
          </div>
          <div class="button_wrap">
            <a href="login.html">CART</a>
            <a href="login.html">WISH LIST</a>
            <a href="login.html">BUY IT NOW</a>
          </div>
        </div>
      </article>
    </section>

    <footer id="footer"></footer>
  </div>
  <script src="js/innerhtml.js"></script>
  <script>
    const GALLERY_THUMB = document.querySelector('.gallery .thumb');
    const GALLERY_BTNS = document.querySelector('.gallery_btns');
    const SELECT = document.querySelector('select');
    const TOTAL_PRICE = document.querySelector('.total_price');
    const TOTAL_AMOUNT = document.querySelector('.total_amount');

    SELECT.addEventListener('change', () => {
      TOTAL_PRICE.innerText = '79,000';
      TOTAL_AMOUNT.innerText = '1';
    });

    GALLERY_BTNS.addEventListener('click', e => {
      if (e.target.matches('img')) {
        let imgSrc = e.target.getAttribute('src');
        GALLERY_THUMB.setAttribute('src', imgSrc);
      }
    });
  </script>
</body>
</html>
