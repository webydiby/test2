<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>클로벳 - 프리오더 굿즈</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <div id="wrap">
    <header id="header"></header>

    <section id="goods">
      <article class="product_header">
        <h3 class="main">프리오더 굿즈 <span class="product_count">(4)</span></h3>
        <div class="align_product">
          <label for="align_newest">
            <input type="radio" name="align_product" id="align_newest" checked>
            <span>신상품순</span>
          </label>
          <label for="align_name">
            <input type="radio" name="align_product" id="align_name">
            <span>상품명순</span>
          </label>
          <label for="align_low_price">
            <input type="radio" name="align_product" id="align_low_price">
            <span>낮은가격순</span>
          </label>
          <label for="align_high_price">
            <input type="radio" name="align_product" id="align_high_price">
            <span>높은가격순</span>
          </label>
          <label for="align_manufacturer">
            <input type="radio" name="align_product" id="align_manufacturer">
            <span>제조사순</span>
          </label>
          <label for="align_review">
            <input type="radio" name="align_product" id="align_review">
            <span>사용후기순</span>
          </label>
        </div>
      </article>

      <article class="pt-0">
        <div class="product_list">
          <a href="detail.html">
            <img src="img/product/product_goods01.png" alt="클로벳 다이나믹 풋워크 오버핏 후드 제품 이미지">
            <div class="txt">
              <p class="name">클로벳 다이나믹 풋워크 오버핏 후드</p>
              <p class="info">자신의 책임을 과감하게 수행하는 다이나믹 풋워크</p>
              <p class="price">65,000원</p>
            </div>
          </a>
          <a href="detail.html">
            <img src="img/product/product_goods02.png" alt="클로벳 택티컬 스마일리 기모후드 [포레스트 프로그] 제품 이미지">
            <div class="txt">
              <p class="name">클로벳 택티컬 스마일리 기모후드 [포레스트 프로그]</p>
              <p class="info">어려움에도 굴하지 않는 클로벳 택티컬스마일리 포레스트 프로그 버젼</p>
              <p class="price">79,000원</p>
            </div>
          </a>
          <a href="detail.html">
            <img src="img/product/product_goods03.png" alt="클로벳 택티컬 스마일리 오버핏 후드 [화이트 심볼] 제품 이미지">
            <div class="txt">
              <p class="name">클로벳 택티컬 스마일리 오버핏 후드 [화이트 심볼]</p>
              <p class="info">어려움에도 굴하지 않는 클로벳 택티컬스마일리 화이트 심볼 버젼</p>
              <p class="price">65,000원</p>
            </div>
          </a>
          <a href="detail.html">
            <img src="img/product/product_goods04.png" alt="클로벳 택티컬스마일리 오버핏 후드 [멀티프로그] 제품 이미지">
            <div class="txt">
              <p class="name">클로벳 택티컬스마일리 오버핏 후드 [멀티프로그]</p>
              <p class="info">어려움에도 굴하지 않는 클로벳 택티컬스마일리 멀티프로그 버젼</p>
              <p class="price">65,000원</p>
            </div>
          </a>
        </div>
      </article>  
    </section>

    <footer id="footer"></footer>
  </div>
  <script src="js/innerhtml.js"></script>
</body>
</html>
